<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-Панель</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 1px solid #eee; }
        .rev { font-size: 28px; font-weight: bold; color: #28a745; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .url { background: #eee; padding: 6px; border-radius: 4px; font-size: 12px; word-break: break-all; display: block; margin-top: 5px; color: #007bff; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎛 Управление Такси</h2>
    <div class="card"><div>📈 Общая выручка:</div><div class="rev" id="revenue">0 ₸</div></div>
    <h4>🔧 Настройка тарифов</h4>
    <label>Подача машины (₸):</label><input type="number" id="base_price">
    <label>Цена за 1 км (₸):</label><input type="number" id="per_km_price">
    <button onclick="save()">Сохранить тарифы</button>

    <div style="background:#e9ecef; padding:15px; border-radius:8px; margin-top:20px;">
        <h4>🔗 Ссылки для BotFather:</h4>
        <b>Клиент:</b> <span class="url" id="client_url"></span>
        <b>Водитель:</b> <span class="url" id="driver_url"></span>
        <b>Админ:</b> <span class="url" id="admin_url"></span>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080';
    async function load() {
        try {
            let r = await fetch(`${API_URL}/api/admin_stats`);
            if (r.ok) {
                let d = await r.json();
                document.getElementById('revenue').innerText = `${d.revenue} ₸`;
                document.getElementById('base_price').value = d.base_price;
                document.getElementById('per_km_price').value = d.per_km_price;
                document.getElementById('client_url').innerText = d.client_url;
                document.getElementById('driver_url').innerText = d.driver_url;
                document.getElementById('admin_url').innerText = d.admin_url;
            }
        } catch(e) {}
    }
    async function save() {
        try {
            let r = await fetch(`${API_URL}/api/update_tariffs`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ base_price: document.getElementById('base_price').value, per_km_price: document.getElementById('per_km_price').value }) });
            if (r.ok) { alert("Сохранено!"); load(); }
        } catch(e) {}
    }
    window.onload = load;
</script>
</body>
</html>
