<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ Такси</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .header { display: flex; flex-direction: column; align-items: center; padding: 15px 10px 5px 10px; background-color: var(--tg-theme-secondary-bg-color, #f5f5f5); }
        .header img { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header h2 { margin: 8px 0 0 0; font-size: 18px; font-weight: bold; }
        #map { height: 35vh; width: 100%; }
        .container { padding: 15px; }
        .input-group { margin-bottom: 10px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .geo-btn { background: #ff9800; margin-bottom: 10px; padding: 8px; font-size: 13px; }
        .price-box { background: var(--tg-theme-secondary-bg-color, #f5f5f5); padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 16px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="Taxi Logo">
        <h2>Заказ Такси Аркабай - Панфилово</h2>
    </div>

    <div id="map"></div>
    <div class="container">
        <button id="geoBtn" class="geo-btn">📍 Определить мою геолокацию</button>
        
        <div class="input-group">
            <input type="text" id="from" placeholder="Откуда (Точка А)">
        </div>
        <div class="input-group">
            <input type="text" id="to" placeholder="Куда (Точка Б) — Кликните на карте">
        </div>
        <!-- Новое поле для комментария -->
        <div class="input-group">
            <input type="text" id="comment" placeholder="Комментарий (например: нужен пустой багажник)">
        </div>
        
        <div class="price-box" id="priceDisplay">Стоимость: 400 ₸ (0 км)</div>

        <button id="orderBtn">Заказать такси</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let latA = 43.3644, lngA = 77.1215;
        let latB = null, lngB = null;       
        let distanceKm = 0;
        let finalPrice = 400;

        const map = L.map('map').setView([latA, lngA], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markerA = L.marker([latA, lngA], {draggable: true}).addTo(map).bindPopup('Откуда (Точка А)').openPopup();
        let markerB = null;

        function haversineDistance(l1, ln1, l2, ln2) {
            const R = 6371;
            const dLat = (l2 - l1) * Math.PI / 180;
            const dLon = (ln2 - ln1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(l1 * Math.PI / 180) * Math.cos(l2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function updatePrice() {
            if (latA && latB) {
                distanceKm = haversineDistance(latA, lngA, latB, lngB);
                finalPrice = Math.round(400 + (distanceKm * 80));
                document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸ (${distanceKm.toFixed(2)} км)`;
            } else {
                document.getElementById('priceDisplay').innerText = `Стоимость: 400 ₸ (Укажите Точку Б)`;
            }
        }

        map.on('click', function(e) {
            latB = e.latlng.lat;
            lngB = e.latlng.lng;
            
            if (markerB) {
                markerB.setLatLng(e.latlng);
            } else {
                markerB = L.marker([latB, lngB], {draggable: true}).addTo(map).bindPopup('Куда (Точка Б)').openPopup();
                markerB.on('dragend', function() {
                    latB = markerB.getLatLng().lat;
                    lngB = markerB.getLatLng().lng;
                    updatePrice();
                });
            }
            document.getElementById('to').value = `Выбрано на карте (${latB.toFixed(4)}, ${lngB.toFixed(4)})`;
            updatePrice();
        });

        markerA.on('dragend', function() {
            latA = markerA.getLatLng().lat;
            lngA = markerA.getLatLng().lng;
            updatePrice();
        });

        document.getElementById('geoBtn').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    latA = position.coords.latitude;
                    lngA = position.coords.longitude;
                    map.setView([latA, lngA], 15);
                    markerA.setLatLng([latA, lngA]);
                    document.getElementById('from').value = `Моя геопозиция`;
                    updatePrice();
                });
            }
        });

        document.getElementById('orderBtn').addEventListener('click', () => {
            const fromText = document.getElementById('from').value;
            const toText = document.getElementById('to').value;
            const commentText = document.getElementById('comment').value;

            if (!fromText || !latB) {
                alert('Пожалуйста, выберите точку А и точку Б на карте!');
                return;
            }

            const orderData = {
                from: fromText,
                to: toText,
                distance: distanceKm,
                price: finalPrice,
                lat: latA,
                lng: lngA,
                comment: commentText // Передаем текст комментария
            };

            tg.sendData(JSON.stringify(orderData));
            tg.close();
        });
    </script>
</body>
</html>
