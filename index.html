<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ Такси</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .header { display: flex; flex-direction: column; align-items: center; padding: 15px 10px 5px 10px; background-color: var(--tg-theme-secondary-bg-color, #f5f5f5); }
        .header img { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #map { height: 35vh; width: 100%; }
        .container { padding: 15px; }
        .input-group { margin-bottom: 10px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        button { width: 100%; padding: 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .price-box { background: var(--tg-theme-secondary-bg-color, #f5f5f5); padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 16px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="Taxi Logo">
        <h2>Заказ Такси Аркабай - Панфилово</h2>
    </div>
    <div id="map"></div>
    <div class="container">
        <div class="input-group"><input type="text" id="from" placeholder="Откуда (Точка А)"></div>
        <div class="input-group"><input type="text" id="to" placeholder="Куда (Точка Б) — Кликните на карте" readonly></div>
        <div class="input-group"><input type="text" id="comment" placeholder="Комментарий к заказу"></div>
        <div class="input-group">
            <select id="paymentMethod">
                <option value="Наличные">💵 Наличные</option>
                <option value="Kaspi">📱 Kaspi перевод</option>
            </select>
        </div>
        <div class="price-box" id="priceDisplay">Загрузка тарифов...</div>
        <button id="orderBtn">Заказать такси</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let latA = 43.3644, lngA = 77.1215;
        let latB = null, lngB = null;       
        let distanceKm = 0, finalPrice = 400;
        let tariffs = { base_price: 400, per_km_price: 80 };

        // Получаем живые тарифы от сервера
        fetch('http://localhost:8080/api/get_tariffs')
            .then(r => r.json())
            .then(data => { tariffs = data; updatePrice(); })
            .catch(() => { updatePrice(); });

        const map = L.map('map').setView([latA, lngA], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let markerA = L.marker([latA, lngA], {draggable: true}).addTo(map);

        function haversineDistance(l1, ln1, l2, ln2) {
            const R = 6371;
            const dLat = (l2 - l1) * Math.PI / 180;
            const dLon = (ln2 - ln1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(l1 * Math.PI / 180) * Math.cos(l2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function updatePrice() {
            if (latA && latB) {
                distanceKm = haversineDistance(latA, lngA, latB, lngB);
                finalPrice = Math.round(tariffs.base_price + (distanceKm * tariffs.per_km_price));
                document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸ (${distanceKm.toFixed(2)} км)`;
            } else {
                document.getElementById('priceDisplay').innerText = `Стоимость: ${tariffs.base_price} ₸ (Укажите Точку Б)`;
            }
        }

        map.on('click', function(e) {
            latB = e.latlng.lat; lngB = e.latlng.lng;
            document.getElementById('to').value = `Выбрано на карте (${latB.toFixed(3)}, ${lngB.toFixed(3)})`;
            updatePrice();
        });

        document.getElementById('orderBtn').addEventListener('click', () => {
            if (!latB) { alert('Выберите маршрут!'); return; }
            tg.sendData(JSON.stringify({
                from: document.getElementById('from').value || "Точка А",
                to: document.getElementById('to').value,
                distance: distanceKm,
                price: finalPrice,
                lat: latA, lng: lngA,
                comment: document.getElementById('comment').value,
                payment: document.getElementById('paymentMethod').value
            }));
            tg.close();
        });
    </script>
</body>
</html>
