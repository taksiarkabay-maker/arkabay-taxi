<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ Такси 2ГИС</title>
    <!-- Подключаем официальный скрипт Telegram WebApp API -->
    <script src="https://telegram.org"></script>
    
    <!-- ПОДКЛЮЧАЕМ LEAFLET ЧЕРЕЗ НАДЕЖНЫЙ CLOUDFLARE CDN (БЕЗ БЛОКИРОВОК) -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #fff; }
        .header { display: flex; flex-direction: column; align-items: center; padding: 15px 10px 5px 10px; background-color: #f5f5f5; text-align: center; }
        .header img { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #map { height: 35vh; width: 100%; background: #e5e3df; border-bottom: 2px solid #ccc; }
        .container { padding: 15px; }
        .input-group { margin-bottom: 10px; }
        .hint-text { font-size: 11px; color: #ff9800; font-weight: bold; margin: -5px 0 10px 2px; display: block; line-height: 1.3; }
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #2481cc; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .geo-btn { background: #ff9800; margin-bottom: 8px; padding: 10px; font-size: 14px; }
        .price-box { background: #f5f5f5; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 16px; border: 1px solid #ddd; color: #2481cc; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="Taxi Logo">
        <h2>Заказ Такси Аркабай - Панфилово (2ГИС)</h2>
    </div>
    
    <!-- Контейнер для карты -->
    <div id="map"></div>
    
    <div class="container">
        <button id="geoBtn" class="geo-btn">📍 Автоматически определить где я</button>
        <span class="hint-text">💡 Кликните на карту для выбора точки Б или переместите маркер точки А.</span>
        
        <div class="input-group"><input type="text" id="from" placeholder="Откуда (Точка А)"></div>
        <div class="input-group"><input type="text" id="to" placeholder="Куда (Точка Б)"></div>
        <div class="input-group"><input type="text" id="comment" placeholder="Комментарий к заказу"></div>
        <div class="input-group">
            <select id="paymentMethod">
                <option value="💵 Наличные">💵 Наличные</option>
                <option value="📱 Kaspi перевод">📱 Kaspi перевод</option>
            </select>
        </div>
        <div class="price-box" id="priceDisplay">Стоимость: 400 ₸</div>
        <button id="orderBtn">Заказать такси</button>
    </div>

    <script type="text/javascript">
        // Инициализируем Telegram WebApp
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.expand();
        }

        let myMap;
        let markerA, markerB;
        let latA = 43.3644, lngA = 77.1215; // Центр поселка Аркабай по умолчанию
        let latB = null, lngB = null;
        let distanceKm = 0, finalPrice = 400;
        let isManualMode = false;

        // Создаем карту на движке Leaflet
        myMap = L.map('map').setView([latA, lngA], 13);
        
        // ПОДКЛЮЧАЕМ СТАБИЛЬНЫЙ СЛОЙ КАРТ С ОТКРЫТЫМИ ТАЙЛАМИ 2ГИС
        L.tileLayer('https://tile{s}://{x}&y={y}&z={z}', {
            subdomains: ['0', '1', '2', '3'],
            attribution: '© 2GIS'
        }).addTo(myMap);

        // Устанавливаем маркер Точки А
        markerA = L.marker([latA, lngA], {draggable: true}).addTo(myMap);
        geocodeAddress(latA, lngA, 'from');

        // Отслеживаем перетаскивание маркера Точки А
        markerA.on('dragend', function () {
            const position = markerA.getLatLng();
            latA = position.lat; lngA = position.lng;
            isManualMode = false;
            geocodeAddress(latA, lngA, 'from');
        });

        // Клик по карте устанавливает Точку Б
        myMap.on('click', function (e) {
            latB = e.latlng.lat; lngB = e.latlng.lng;
            isManualMode = false;

            if (markerB) {
                markerB.setLatLng(e.latlng);
            } else {
                markerB = L.marker([latB, lngB], {draggable: true}).addTo(myMap);
                markerB.on('dragend', function () {
                    const pos = markerB.getLatLng();
                    latB = pos.lat; lngB = pos.lng;
                    geocodeAddress(latB, lngB, 'to');
                });
            }
            geocodeAddress(latB, lngB, 'to');
        });

        // Слушаем ручной текстовый ввод для пересчета цен по зонам
        document.getElementById('from').addEventListener('input', () => { isManualMode = true; calculatePrice(); });
        document.getElementById('to').addEventListener('input', () => { isManualMode = true; calculatePrice(); });

        // ИСПРАВЛЕННЫЙ РАБОЧИЙ ГЕОКОДЕР NOMINATIM API
        function geocodeAddress(lat, lng, inputId) {
            const inputField = document.getElementById(inputId);
            inputField.value = "⏳ Распознаем адрес...";

            fetch(`https://openstreetmap.org{lat}&lon=${lng}&accept-language=ru`)
                .then(r => r.json())
                .then(data => {
                    if (data.address) {
                        const road = data.address.road || "";
                        const house = data.address.house_number || "";
                        const village = data.address.village || data.address.suburb || data.address.town || data.address.city || "";
                        inputField.value = `${village} ${road} ${house}`.trim().replace(/\s+/g, ' ') || "Точка на карте";
                    } else {
                        inputField.value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    }
                    calculatePrice();
                }).catch(() => {
                    inputField.value = "Геометка установлена";
                    calculatePrice();
                });
        }

        function getZone(addressText) {
            const txt = addressText.toLowerCase();
            if (txt.includes('аркабай') || txt.includes('аркабаи')) return 'arkabay';
            if (txt.includes('панфилово') || txt.includes('панфилов')) return 'panfilovo';
            if (txt.includes('талгар')) return 'talgar';
            if (txt.includes('алматы') || txt.includes('алмата') || txt.includes('город')) return 'almaty';
            return 'unknown';
        }

        // Динамический расчет цен по формуле (Подача 400 + 80 тг за км) или по зонам
        function calculatePrice() {
            const fromVal = document.getElementById('from').value;
            const toVal = document.getElementById('to').value;

            if (isManualMode && fromVal && toVal) {
                const zoneA = getZone(fromVal);
                const zoneB = getZone(toVal);

                if (zoneA === 'unknown' || zoneB === 'unknown') {
                    finalPrice = 400;
                    document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸`;
                    return;
                }

                if (zoneA === zoneB) { finalPrice = 500; document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸ (Внутри поселка)`; }
                else if ((zoneA === 'arkabay' && zoneB === 'panfilovo') || (zoneA === 'panfilovo' && zoneB === 'arkabay')) { finalPrice = 800; document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸ (Межпоселковый)`; }
                else if (zoneA === 'talgar' || zoneB === 'talgar') { finalPrice = 2500; document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸ (До Талгара)`; }
                else if (zoneA === 'almaty' || zoneB === 'almaty') { finalPrice = 4000; document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸ (До города)`; }
            } else {
                if (latA && latB) {
                    const R = 6371; // Радиус Земли в км
                    const dLat = (latB - latA) * Math.PI / 180;
                    const dLon = (lngB - lngA) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(latA * Math.PI / 180) * Math.cos(latB * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                    distanceKm = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
                    
                    finalPrice = Math.round(400 + (distanceKm * 80));
                    document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸ (${distanceKm.toFixed(2)} км)`;
                }
            }
        }

        // ИСПРАВЛЕННЫЙ И ДОПИСАННЫЙ ДО КОНЦА GPS ТРЕКЕР
        document.getElementById('geoBtn').addEventListener('click', () => {
            if (navigator.geolocation) {
                document.getElementById('from').value = "⏳ GPS поиск...";
                navigator.geolocation.getCurrentPosition((position) => {
                    latA = position.coords.latitude;
                    lngA = position.coords.longitude;
                    myMap.setView([latA, lngA], 16);
                    markerA.setLatLng([latA, lngA]);
                    geocodeAddress(latA, lngA, 'from');
                }, () => {
                    document.getElementById('from').value = "Не удалось определить GPS";
                });
            } else {
                }, () => {
                    document.getElementById('from').value = "Не удалось определить GPS";
                });
            } else {
                alert("Ваше устройство не поддерживает геолокацию"); 
            } 
        });

        // Отправка готового заказа Telegram-боту 
        document.getElementById('orderBtn').addEventListener('click', () => { 
            const fromText = document.getElementById('from').value; 
            const toText = document.getElementById('to').value; 
            const commentText = document.getElementById('comment').value || "No"; 
            const paymentText = document.getElementById('paymentMethod').value;

            if (!fromText || fromText.startsWith("⏳") || !toText || toText.startsWith("⏳")) { 
                alert("Пожалуйста, отметьте точки A и B на карте или введите текст!"); 
                return; 
            }

            const orderData = { 
                from_address: fromText, 
                to_address: toText, 
                comment: commentText, 
                payment_method: paymentText, 
                price: finalPrice, 
                lat: latA, 
                lng: lngA 
            };

                     if (tg) { 
                // Отправляем JSON-строку в чат нашего Python-бота 
                tg.sendData(JSON.stringify(orderData)); 
                tg.close(); 
            } else { 
                alert("Данные заказа (локальный тест без Telegram):\n" + JSON.stringify(orderData, null, 2)); 
            } 
        });
    </script>
</body>
</html>
