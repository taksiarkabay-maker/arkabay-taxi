<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ Такси</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .header { display: flex; flex-direction: column; align-items: center; padding: 15px 10px 5px 10px; background-color: var(--tg-theme-secondary-bg-color, #f5f5f5); }
        .header img { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header h2 { margin: 8px 0 0 0; font-size: 18px; font-weight: bold; }
        #map { height: 40vh; width: 100%; }
        .container { padding: 15px; }
        .input-group { margin-bottom: 10px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .geo-btn { background: #ff9800; margin-bottom: 10px; padding: 8px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" alt="Taxi Logo">
        <h2>Заказ Такси Аркабай - Панфилово</h2>
    </div>

    <div id="map"></div>
    <div class="container">
        <!-- Кнопка автоматического определения позиции -->
        <button id="geoBtn" class="geo-btn">📍 Определить мою геолокацию</button>
        
        <div class="input-group">
            <input type="text" id="from" placeholder="Откуда (Точка А)">
        </div>
        <div class="input-group">
            <input type="text" id="to" placeholder="Куда (Точка Б)">
        </div>
        <div class="input-group">
            <select id="tariff">
                <option value="эконом">Эконом</option>
                <option value="комфорт">Комфорт</option>
                <option value="бизнес">Бизнес</option>
            </select>
        </div>
        <button id="orderBtn">Заказать такси</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Координаты по умолчанию (центр между поселками)
        let userLat = 43.3644;
        let userLng = 77.1215;

        const map = L.map('map').setView([userLat, userLng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let userMarker = L.marker([userLat, userLng], {draggable: true}).addTo(map).bindPopup('Ваше местоположение (Точка А)');

        // Логика автоматического определения геолокации пассажира
        document.getElementById('geoBtn').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    
                    // Перемещаем карту и маркер на реальные координаты пассажира
                    const newPos = [userLat, userLng];
                    map.setView(newPos, 16);
                    userMarker.setLatLng(newPos);
                    
                    // Делаем текстовую подсказку в поле ввода через бесплатный поиск адресов
                    fetch(`https://openstreetmap.org{userLat}&lon=${userLng}`)
                        .then(response => response.json())
                        .then(data => {
                            if(data.display_name) {
                                document.getElementById('from').value = data.address.road || data.display_name.split(',')[0];
                            }
                        }).catch(() => {
                            document.getElementById('from').value = `Мои координаты: ${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
                        });
                }, () => {
                    alert('Не удалось получить доступ к геопозиции. Пожалуйста, введите адрес вручную или включите GPS на телефоне.');
                });
            } else {
                alert('Ваш браузер не поддерживает автоопределение геопозиции.');
            }
        });

        // Следим за тем, если пользователь двигает маркер руками
        userMarker.on('dragend', function (e) {
            const position = userMarker.getLatLng();
            userLat = position.lat;
            userLng = position.lng;
        });

        document.getElementById('orderBtn').addEventListener('click', () => {
            const fromText = document.getElementById('from').value;
            const toText = document.getElementById('to').value;
            const tariff = document.getElementById('tariff').value;

            if (!fromText || !toText) {
                alert('Пожалуйста, зафиксируйте точку А и Б!');
                return;
            }

            // Передаем в бота не только текст, но и точные географические координаты пассажира
            const orderData = {
                from: fromText,
                to: toText,
                tariff: tariff,
                lat: userLat,
                lng: userLng,
                price: Math.floor(Math.random() * 300) + 400
            };

            tg.sendData(JSON.stringify(orderData));
            tg.close();
        });
    </script>
</body>
</html>
