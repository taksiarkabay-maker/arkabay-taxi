    <script type="text/javascript">
        // Инициализируем Telegram WebApp API
        let tg = window.Telegram?.WebApp || null;
        if (tg) tg.expand();

        // Объявляем глобальные переменные БЕЗ прямого вызова Leaflet на старте
        let myMap = null;
        let markerA = null;
        let markerB = null;
        let latA = 43.3644;
        let lngA = 77.1215; 
        let latB = null;
        let lngB = null;
        let finalPrice = 400;
        let isManualMode = false;

        // БЕЗОПАСНАЯ ФУНКЦИЯ ОЖИДАНИЯ
        function initMapWhenReady() {
            if (typeof L === 'undefined') {
                // Если объект L еще не готов, ждем 100 миллисекунд и пробуем снова
                setTimeout(initMapWhenReady, 100);
                return;
            }

            // Инициализируем карту внутри блока id="map" (теперь объект L точно готов!)
            myMap = L.map('map', {
                zoomControl: true,
                boxZoom: false,
                doubleClickZoom: true
            }).setView([latA, lngA], 13);

            // Стили для векторных дорог из GeoJSON
            const roadStyle = { "color": "#2481cc", "weight": 4, "opacity": 0.85 };

            // Загружаем локальный GeoJSON файл карты напрямую из вашего репозитория
            fetch('map_data.geojson')
                .then(response => {
                    if (!response.ok) throw new Error('Файл карты map_data.geojson не найден');
                    return response.json();
                })
                .then(geojsonData => {
                    // Отрисовываем схему дорог на экране пассажира
                    L.geoJSON(geojsonData, {
                        style: roadStyle,
                        onEachFeature: function (feature, layer) {
                            if (feature.properties && feature.properties.name) {
                                layer.bindPopup("Улица: " + feature.properties.name);
                            }
                        }
                    }).addTo(myMap);
                    
                    initMarkers();
                })
                .catch(error => {
                    console.error("Ошибка загрузки локальной карты:", error);
                    initMarkers();
                });
        }

        // Функция создания маркеров А и Б
        function initMarkers() {
            if (!myMap || markerA) return;
            
            markerA = L.marker([latA, lngA], {draggable: true}).addTo(myMap);
            geocodeAddress(latA, lngA, 'from');

            markerA.on('dragend', function () {
                const position = markerA.getLatLng();
                latA = position.lat; lngA = position.lng;
                isManualMode = false;
                geocodeAddress(latA, lngA, 'from');
            });

            myMap.on('click', function (e) {
                latB = e.latlng.lat; lngB = e.latlng.lng;
                isManualMode = false;

                if (markerB) {
                    markerB.setLatLng(e.latlng);
                } else {
                    markerB = L.marker([latB, lngB], {draggable: true}).addTo(myMap);
                    markerB.on('dragend', function () {
                        const pos = markerB.getLatLng();
                        latB = pos.lat; lngB = pos.lng;
                        geocodeAddress(latB, lngB, 'to');
                    });
                }
                geocodeAddress(latB, lngB, 'to');
            });
        }

        // ТОЧКА ВХОДА: Запускаем безопасный цикл контроля загрузки
        initMapWhenReady();

        document.getElementById('from').addEventListener('input', () => { isManualMode = true; calculatePrice(); });
        document.getElementById('to').addEventListener('input', () => { isManualMode = true; calculatePrice(); });

        function geocodeAddress(lat, lng, inputId) {
            const inputField = document.getElementById(inputId);
            inputField.value = "⏳ Распознаем адрес...";

            fetch(`https://openstreetmap.org{lat}&lon=${lng}&accept-language=ru`)
                .then(r => r.json())
                .then(data => {
                    if (data.address) {
                        const road = data.address.road || "";
                        const house = data.address.house_number || "";
                        const village = data.address.village || data.address.suburb || data.address.town || data.address.city || "";
                        inputField.value = `${village} ${road} ${house}`.trim().replace(/\s+/g, ' ') || "Точка на карте";
                    } else {
                        inputField.value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    }
                    calculatePrice();
                }).catch(() => {
                    inputField.value = "Геометка установлена";
                    calculatePrice();
                });
        }

        function getZone(addressText) {
            const txt = addressText.toLowerCase();
            if (txt.includes('аркабай') || txt.includes('аркабаи')) return 'arkabay';
            if (txt.includes('панфилово') || txt.includes('панфилов')) return 'panfilovo';
            if (txt.includes('талгар')) return 'talgar';
            if (txt.includes('алматы') || txt.includes('алмата') || txt.includes('город')) return 'almaty';
            return 'unknown';
        }

        function calculatePrice() {
            const fromVal = document.getElementById('from').value;
            const toVal = document.getElementById('to').value;

            if (isManualMode && fromVal && toVal) {
                const zoneA = getZone(fromVal);
                const zoneB = getZone(toVal);

                if (zoneA === 'unknown' || zoneB === 'unknown') {
                    finalPrice = 400;
                    document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸`;
                    return;
                }

                if (zoneA === zoneB) { finalPrice = 500; }
                else if ((zoneA === 'arkabay' && zoneB === 'panfilovo') || (zoneA === 'panfilovo' && zoneB === 'arkabay')) { finalPrice = 800; }
                else if (zoneA === 'talgar' || zoneB === 'talgar') { finalPrice = 2500; }
                else if (zoneA === 'almaty' || zoneB === 'almaty') { finalPrice = 4000; }
                document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸`;
            } else {
                if (latA && latB) {
                    const R = 6371; 
                    const dLat = (latB - latA) * Math.PI / 180;
                    const dLon = (lngB - lngA) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(latA * Math.PI / 180) * Math.cos(latB * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                    const distanceKm = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
                    finalPrice = Math.round(400 + (distanceKm * 80));
                    document.getElementById('priceDisplay').innerText = `Стоимость: ${finalPrice} ₸ (${distanceKm.toFixed(2)} км)`;
                }
            }
        }

        document.getElementById('geoBtn').addEventListener('click', () => {
            if (navigator.geolocation) {
                document.getElementById('from').value = "⏳ GPS поиск...";
                navigator.geolocation.getCurrentPosition((position) => {
                    latA = position.coords.latitude;
                    lngA = position.coords.longitude;
                    if (myMap) {
                        myMap.setView([latA, lngA], 16);
                        if (markerA) markerA.setLatLng([latA, lngA]);
                    }
                    geocodeAddress(latA, lngA, 'from');
                }, () => {
                    document.getElementById('from').value = "Не удалось определить GPS";
                });
            }
        });

        document.getElementById('orderBtn').addEventListener('click', () => {
            const fromText = document.getElementById('from').value;
            const toText = document.getElementById('to').value;
            const commentText = document.getElementById('comment').value || "No";
            const paymentText = document.getElementById('paymentMethod').value;

            if (!fromText || fromText.startsWith("⏳") || !toText || toText.startsWith("⏳")) {
                alert("Пожалуйста, отметьте точки A и B на карте или введите текст!");
                return;
            }

            const orderData = { from_address: fromText, to_address: toText, comment: commentText, payment_method: paymentText, price: finalPrice, lat: latA, lng: lngA };

            if (tg) {
                tg.sendData(JSON.stringify(orderData));
                tg.close();
            } else {
                alert("Локальный тест:\n" + JSON.stringify(orderData, null, 2));
            }
        });
    </script>
