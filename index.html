<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта Такси</title>
    
    <!-- Стабильное подключение библиотек карт Leaflet через Cloudflare CDN -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    
    <style>
        /* Растягиваем карту на всю ширину и высоту экрана устройства */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
        }
        #map {
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>

    <!-- Единственный контейнер для отображения карты -->
    <div id="map"></div>

    <script type="text/javascript">
        // Защитная функция: ждем, пока объект L полностью загрузится в память браузера
        function initMapWhenReady() {
            if (typeof L === 'undefined') {
                setTimeout(initMapWhenReady, 50);
                return;
            }

            // Координаты центра поселка Аркабай (Талгарский район)
            const lat = 43.3644;
            const lng = 77.1215;

            // Создаем карту внутри блока id="map" с базовым зумом 14
            const myMap = L.map('map', {
                zoomControl: true,
                boxZoom: false,
                doubleClickZoom: true
            }).setView([lat, lng], 14);
            
            // Подключаем стабильный слой карт OpenStreetMap по протоколу HTTPS
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(myMap);

            // Ставим один аккуратный маркер в центр карты
            L.marker([lat, lng]).addTo(myMap);
        }

        // Запускаем безопасную инициализацию карты
        initMapWhenReady();
    </script>
</body>
</html>
